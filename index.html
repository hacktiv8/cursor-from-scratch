<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kala — Jam & Tanggal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="stage">
      <p class="brand">Kala</p>

      <time id="clock" class="clock" datetime="">
        <span data-part="hours">00</span><span class="sep" aria-hidden="true">:</span><span data-part="minutes">00</span><span class="sep" aria-hidden="true">:</span><span data-part="seconds">00</span>
      </time>

      <p id="date" class="date"></p>
      <p id="zone" class="zone"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
